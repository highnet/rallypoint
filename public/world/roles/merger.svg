<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 286 887" width="286" height="887" role="img" aria-label="Bestiary plate: the Merger, a hooded heron ferryman at a stone ford">
  <title>The Merger — the ferryman</title>

  <defs>
    <linearGradient id="vellum" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#efe3c8" />
      <stop offset="45%" stop-color="#e7d9bb" />
      <stop offset="100%" stop-color="#dccaa6" />
    </linearGradient>

    <radialGradient id="foxing" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="70%" stop-color="#5a4326" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#4a3413" stop-opacity="0.22" />
    </radialGradient>

    <linearGradient id="robe" x1="0.2" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#3c4348" />
      <stop offset="55%" stop-color="#2b3135" />
      <stop offset="100%" stop-color="#1d2225" />
    </linearGradient>

    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5c877" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#e09a3e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e09a3e" stop-opacity="0" />
    </radialGradient>

    <!-- Paper tooth. Keeps the flat fills from reading as vector clip art. -->
    <filter id="tooth" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="n" />
      <feColorMatrix in="n" type="saturate" values="0" result="g" />
      <feComponentTransfer in="g" result="a">
        <feFuncA type="linear" slope="0.13" intercept="0" />
      </feComponentTransfer>
      <feComposite in="a" in2="SourceGraphic" operator="in" />
    </filter>

    <filter id="softInk" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" />
    </filter>
  </defs>

  <!-- Ground -->
  <rect width="286" height="887" fill="url(#vellum)" />
  <rect width="286" height="887" fill="url(#foxing)" />
  <rect width="286" height="887" filter="url(#tooth)" fill="#6b5230" opacity="0.5" />

  <!-- Ruled plate border -->
  <g fill="none" stroke="#5c4a2c" stroke-opacity="0.85">
    <rect x="8.5" y="8.5" width="269" height="870" stroke-width="2" />
    <rect x="14.5" y="14.5" width="257" height="858" stroke-width="0.8" stroke-opacity="0.55" />
  </g>
  <g fill="#5c4a2c" opacity="0.75">
    <path d="M8 8 h16 v2 h-14 v14 h-2 z" />
    <path d="M278 8 h-16 v2 h14 v14 h2 z" />
    <path d="M8 879 h16 v-2 h-14 v-14 h-2 z" />
    <path d="M278 879 h-16 v-2 h14 v-14 h2 z" />
  </g>

  <!-- ── Marginalia: specimen sketches, as on the other plates ───────────── -->
  <g stroke="#4a3a20" stroke-opacity="0.75" fill="none" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ford stones, plan view -->
    <g transform="translate(30 44)">
      <ellipse cx="14" cy="12" rx="13" ry="8" />
      <ellipse cx="14" cy="12" rx="8" ry="4.5" stroke-opacity="0.4" />
      <ellipse cx="38" cy="20" rx="10" ry="6" />
      <ellipse cx="8" cy="30" rx="8" ry="5" />
      <path d="M-2 44 q16 -6 30 0 t30 -2" stroke-opacity="0.45" />
      <path d="M-2 50 q16 -6 30 0 t30 -2" stroke-opacity="0.3" />
    </g>

    <!-- Keystone specimen -->
    <g transform="translate(196 40)">
      <path d="M14 4 L26 30 L2 30 Z" />
      <path d="M8 18 h12" stroke-opacity="0.45" />
      <path d="M0 34 h28" stroke-opacity="0.5" />
      <path d="M4 40 l4 -6 M14 40 l4 -6 M24 40 l4 -6" stroke-opacity="0.35" />
    </g>

    <!-- Reed sprig -->
    <g transform="translate(140 34)">
      <path d="M10 60 C10 40 6 26 2 14" />
      <path d="M10 60 C12 42 18 30 24 20" />
      <ellipse cx="2" cy="11" rx="2.6" ry="7" />
      <ellipse cx="25" cy="17" rx="2.2" ry="6" transform="rotate(18 25 17)" />
      <path d="M10 60 h-6 M10 60 h6" stroke-opacity="0.4" />
    </g>
  </g>

  <!-- Hand-lettered specimen note -->
  <g fill="#4a3a20" opacity="0.5">
    <path d="M32 104 h58 M32 109 h44 M196 104 h56 M196 109 h38" stroke="#4a3a20" stroke-width="0.9" />
  </g>

  <!-- ── The water, behind the figure ────────────────────────────────────── -->
  <g stroke="#3f4c50" stroke-opacity="0.35" fill="none" stroke-width="1.2" stroke-linecap="round">
    <path d="M18 690 q40 -10 78 0 t80 -4 t92 6" />
    <path d="M18 712 q46 -12 84 2 t86 -6 t80 8" />
    <path d="M18 736 q38 -8 74 4 t92 -6 t84 8" />
    <path d="M18 762 q52 -10 90 2 t76 -4 t84 6" stroke-opacity="0.25" />
    <path d="M18 788 q44 -8 82 4 t88 -6 t80 6" stroke-opacity="0.2" />
  </g>

  <!-- ── Figure: hooded heron ferryman ───────────────────────────────────── -->
  <g>
    <!-- Punt pole, behind the body -->
    <g>
      <path d="M64 176 L104 800" stroke="#6b5433" stroke-width="9" stroke-linecap="round" />
      <path d="M64 176 L104 800" stroke="#8a6d43" stroke-width="4" stroke-linecap="round" stroke-opacity="0.55" />
      <path d="M66 210 l36 0" stroke="#4a3a20" stroke-width="0" />
      <!-- pole bindings -->
      <g stroke="#3b2f1c" stroke-width="2.4" stroke-opacity="0.7">
        <path d="M72 274 l10 1" />
        <path d="M80 396 l10 1" />
        <path d="M90 552 l10 1" />
      </g>
    </g>

    <!-- Robe -->
    <path d="M143 236
             C104 250 84 292 76 344
             C66 414 60 520 56 620
             C53 692 52 742 52 786
             L236 786
             C236 736 234 686 230 618
             C224 516 218 412 208 344
             C200 292 182 250 143 236 Z"
          fill="url(#robe)" stroke="#171b1e" stroke-width="2" />

    <!-- Robe folds -->
    <g stroke="#101416" stroke-opacity="0.55" fill="none" stroke-width="1.8" stroke-linecap="round">
      <path d="M104 300 C96 400 90 540 86 780" />
      <path d="M128 292 C124 410 120 560 118 782" />
      <path d="M158 292 C162 410 166 560 168 782" />
      <path d="M184 302 C192 402 198 542 202 780" />
      <path d="M74 372 C70 470 66 620 64 782" stroke-opacity="0.4" />
      <path d="M212 374 C216 472 220 622 222 782" stroke-opacity="0.4" />
    </g>
    <g stroke="#5d6a70" stroke-opacity="0.32" fill="none" stroke-width="1.1" stroke-linecap="round">
      <path d="M116 320 C112 430 108 570 106 780" />
      <path d="M172 320 C176 430 180 570 182 780" />
      <path d="M146 300 C146 430 146 600 146 782" />
    </g>

    <!-- Crossed belts and the ferryman's tally -->
    <g stroke="#6b5433" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M104 322 L186 396" />
      <path d="M186 330 L108 402" />
    </g>
    <g stroke="#3b2f1c" stroke-width="1.6" fill="none" stroke-opacity="0.8">
      <path d="M104 322 L186 396" />
      <path d="M186 330 L108 402" />
    </g>
    <rect x="132" y="352" width="24" height="20" rx="3" fill="#7d6238" stroke="#3b2f1c" stroke-width="2" />
    <path d="M138 358 h12 M138 364 h8" stroke="#3b2f1c" stroke-width="1.4" />

    <!-- Waist belt with the crossing-toll purse -->
    <path d="M70 470 L218 470" stroke="#6b5433" stroke-width="9" stroke-linecap="round" />
    <path d="M70 470 L218 470" stroke="#3b2f1c" stroke-width="1.6" stroke-opacity="0.8" />
    <path d="M176 470 c14 0 22 12 20 26 c-2 14 -12 22 -22 22 c-10 0 -20 -8 -22 -22 c-2 -14 8 -26 24 -26 z"
          fill="#4a3c24" stroke="#241d10" stroke-width="2" />
    <path d="M164 490 q12 6 24 0" stroke="#241d10" stroke-width="1.4" fill="none" stroke-opacity="0.7" />

    <!-- Left hand on the pole -->
    <g>
      <path d="M74 300 c14 -8 28 -2 32 10 c4 12 -4 24 -16 26 c-14 2 -26 -8 -26 -20 c0 -8 4 -13 10 -16 z"
            fill="#39413f" stroke="#161b1c" stroke-width="2" />
      <g stroke="#161b1c" stroke-width="1.4" stroke-opacity="0.8" fill="none">
        <path d="M76 306 q12 -4 22 4" />
        <path d="M74 316 q12 -4 24 4" />
        <path d="M76 326 q10 -3 20 3" />
      </g>
    </g>

    <!-- Right hand holding the lantern -->
    <g>
      <path d="M198 470 c14 -6 26 2 28 14 c2 12 -8 22 -20 22 c-12 0 -22 -10 -20 -22 c1 -7 5 -11 12 -14 z"
            fill="#39413f" stroke="#161b1c" stroke-width="2" />
      <g stroke="#161b1c" stroke-width="1.4" stroke-opacity="0.8" fill="none">
        <path d="M198 478 q12 -3 22 4" />
        <path d="M196 488 q13 -3 24 4" />
      </g>
    </g>

    <!-- Hood and shoulders -->
    <path d="M143 236
             C112 244 92 272 92 306
             C92 322 100 334 112 340
             C120 300 130 280 143 274
             C156 280 166 300 174 340
             C186 334 194 322 194 306
             C194 272 174 244 143 236 Z"
          fill="#2a3034" stroke="#141819" stroke-width="2" />

    <!-- Head: heron, long beak -->
    <g>
      <path d="M143 152
               C122 152 110 170 110 194
               C110 214 120 232 136 240
               C142 242 150 242 156 240
               C170 232 178 214 178 194
               C178 170 166 152 143 152 Z"
            fill="#e8e2d3" stroke="#2b2a24" stroke-width="2" />
      <!-- crown plume -->
      <path d="M150 156 C168 142 186 138 198 142 C186 148 172 156 160 168"
            fill="#cfc7b4" stroke="#2b2a24" stroke-width="1.6" />
      <!-- dark crown stripe -->
      <path d="M126 168 C138 158 152 156 164 162 C154 168 140 172 130 180 Z"
            fill="#33322b" opacity="0.85" />
      <!-- beak -->
      <path d="M141 196 L128 292 L152 292 Z" fill="#d8a94a" stroke="#4a3a20" stroke-width="2" stroke-linejoin="round" />
      <path d="M141 200 L136 288" stroke="#8a6a2c" stroke-width="1.4" stroke-opacity="0.8" />
      <!-- eye -->
      <circle cx="126" cy="190" r="7.5" fill="#f3efe4" stroke="#2b2a24" stroke-width="1.8" />
      <circle cx="126" cy="190" r="3.4" fill="#20211c" />
      <circle cx="124.4" cy="188.4" r="1.1" fill="#ffffff" opacity="0.9" />
      <circle cx="162" cy="190" r="6" fill="#f3efe4" stroke="#2b2a24" stroke-width="1.6" opacity="0.55" />
      <circle cx="162" cy="190" r="2.6" fill="#20211c" opacity="0.55" />
      <!-- plumage strokes -->
      <g stroke="#5c584a" stroke-opacity="0.45" stroke-width="1" fill="none" stroke-linecap="round">
        <path d="M116 206 q8 6 6 16" />
        <path d="M170 206 q-8 6 -6 16" />
        <path d="M120 222 q10 6 10 14" />
        <path d="M166 222 q-10 6 -10 14" />
      </g>
    </g>

    <!-- Hood opening shadow -->
    <path d="M143 236 C126 240 114 254 110 268 C124 254 132 248 143 246 C154 248 162 254 176 268 C172 254 160 240 143 236 Z"
          fill="#12161a" opacity="0.55" filter="url(#softInk)" />
  </g>

  <!-- ── Lantern, in front of the robe ───────────────────────────────────── -->
  <g transform="translate(196 508)">
    <circle cx="14" cy="52" r="54" fill="url(#lanternGlow)" />
    <path d="M14 0 v10" stroke="#6b5433" stroke-width="3" />
    <path d="M2 10 h24" stroke="#6b5433" stroke-width="3.4" stroke-linecap="round" />
    <rect x="0" y="14" width="28" height="6" rx="2" fill="#7d6238" stroke="#3b2f1c" stroke-width="1.6" />
    <path d="M3 20 L3 74 L25 74 L25 20 Z" fill="#e9d9a8" fill-opacity="0.45" stroke="#3b2f1c" stroke-width="2" />
    <path d="M3 20 L25 74 M25 20 L3 74" stroke="#3b2f1c" stroke-width="1.2" stroke-opacity="0.6" />
    <rect x="0" y="74" width="28" height="8" rx="2" fill="#7d6238" stroke="#3b2f1c" stroke-width="1.6" />
    <ellipse cx="14" cy="50" rx="5" ry="9" fill="#f6cf83" />
    <ellipse cx="14" cy="50" rx="2.4" ry="5" fill="#fdf0cf" />
  </g>

  <!-- ── Foreground: the ford stones ─────────────────────────────────────── -->
  <g>
    <path d="M10 800 q28 -22 62 -6 q30 14 62 -4 q34 -18 66 0 q30 16 76 -6 l0 96 l-266 0 z"
          fill="#5f5442" fill-opacity="0.5" stroke="#3a3226" stroke-width="1.6" />
    <g fill="#7a6c53" fill-opacity="0.65" stroke="#3a3226" stroke-width="1.6">
      <ellipse cx="52" cy="826" rx="30" ry="13" />
      <ellipse cx="140" cy="838" rx="34" ry="14" />
      <ellipse cx="230" cy="824" rx="30" ry="12" />
      <ellipse cx="96" cy="864" rx="26" ry="11" />
      <ellipse cx="196" cy="862" rx="28" ry="11" />
    </g>
    <g stroke="#3a3226" stroke-opacity="0.4" stroke-width="1" fill="none">
      <path d="M36 824 q16 -6 32 0" />
      <path d="M122 836 q18 -6 36 0" />
      <path d="M214 822 q16 -5 32 0" />
    </g>
  </g>

  <!-- Plate ink vignette -->
  <rect x="15" y="15" width="256" height="857" fill="url(#foxing)" opacity="0.5" />
</svg>
