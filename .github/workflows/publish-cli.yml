name: Publish CLI to npm

on:
  push:
    branches: [main]
  # Manual escape hatch: release-please only reports release_created on the run
  # that cuts the release, so a publish that fails for an environmental reason
  # cannot be recovered by a re-run. Dispatch from main to publish it by hand.
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # npm@latest dropped Node 20 (it now requires ^22.22.2 || ^24.15.0 ||
      # >=26.0.0), which broke this step on the 0.4.0 release. Node 24 already
      # ships an npm new enough for OIDC, so this is now belt and braces.
      - name: Update npm for OIDC trusted publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run the CLI test gate
        run: npm run cli:test

      - name: Run the Swarm test gate
        run: npm run swarm:test

      # Authenticates via OIDC trusted publishing (npm's Trusted Publisher
      # setting for this repo + workflow filename) — no NPM_TOKEN secret.
      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish

  # Installs the version just published, from npm, the way users do, and
  # drives add loop → init → add swarm → swarm doctor → swarm plan --dry-run
  # against a fake gh and a fake Supabase. A failure here means the release on
  # npm is broken even though the test gates passed.
  smoke:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Read the published version
        id: version
        run: echo "version=$(node -p "require('./packages/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Wait for the version on npm
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 40); do
            if [ "$(npm view "rallypoint@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              echo "rallypoint@$VERSION is on npm."
              exit 0
            fi
            echo "Waiting for rallypoint@$VERSION on npm (attempt $attempt/40)…"
            sleep 15
          done
          echo "::error title=Smoke test::rallypoint@$VERSION did not appear on npm within 10 minutes"
          exit 1

      - name: Smoke test the published CLI
        run: node .github/scripts/smoke-published-cli.mjs "${{ steps.version.outputs.version }}"
