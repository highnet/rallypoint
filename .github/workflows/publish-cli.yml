name: Publish CLI to npm

on:
  push:
    branches: [main]
    paths:
      - "packages/cli/package.json"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Update npm for OIDC trusted publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run the CLI test gate
        run: npm run cli:test

      - name: Compare local and published versions
        id: version-check
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/cli/package.json').version")
          PUBLISHED_VERSION=$(npm view rallypoint version 2>/dev/null || echo "")
          echo "Local version:     $LOCAL_VERSION"
          echo "Published version: ${PUBLISHED_VERSION:-<none>}"
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Authenticates via OIDC trusted publishing (npm's Trusted Publisher
      # setting for this repo + workflow filename) — no NPM_TOKEN secret.
      - name: Publish to npm
        if: steps.version-check.outputs.skip == 'false'
        working-directory: packages/cli
        run: npm publish

      - name: Already published, skipping
        if: steps.version-check.outputs.skip == 'true'
        run: echo "rallypoint@${{ steps.version-check.outputs.local }} is already on npm — nothing to publish."
