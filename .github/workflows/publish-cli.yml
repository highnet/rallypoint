name: Publish CLI to npm

on:
  push:
    branches: [main]
  # Manual escape hatch: release-please only reports release_created on the run
  # that cuts the release, so a publish that fails for an environmental reason
  # cannot be recovered by a re-run. Dispatch from main to publish it by hand.
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['packages/cli--release_created'] }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      # npm@latest dropped Node 20 (it now requires ^22.22.2 || ^24.15.0 ||
      # >=26.0.0), which broke this step on the 0.4.0 release. Node 24 already
      # ships an npm new enough for OIDC, so this is now belt and braces.
      - name: Update npm for OIDC trusted publishing support
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run the CLI test gate
        run: npm run cli:test

      # Authenticates via OIDC trusted publishing (npm's Trusted Publisher
      # setting for this repo + workflow filename) — no NPM_TOKEN secret.
      - name: Publish to npm
        working-directory: packages/cli
        run: npm publish
